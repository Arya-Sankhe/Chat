use_default_settings:
  engines:
    keep_only:
      - duckduckgo

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "klui-internal-searxng-change-me"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

engines:
  # DDG's public IP-facing HTML endpoint is CAPTCHA-prone. Use its official
  # onion endpoint through the private Tor sidecar instead. Keep it on its
  # first page: asking for a follow-up page without its vqd token is treated
  # as bot traffic.
  - name: duckduckgo
    ddg_url: "https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion/html/"
    proxies:
      http:
        - socks5h://tor:9050
      https:
        - socks5h://tor:9050
    using_tor_proxy: true
    paging: false
    timeout: 15.0
    disabled: false
