name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  billing-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real billing functions against PostgreSQL
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f test/sql/bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f test/sql/actual-usage-budget.sql

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install document worker dependencies
        run: npm ci --prefix worker
      - name: Syntax check (server, client, scripts, tests)
        run: npm run check:syntax
      - name: Verify CSS split against baseline
        run: npm run check:css-split
      - name: Run test suite
        run: npm test
      - name: Verify mobile bundle builds
        run: npm run mobile:build
