<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#07111f">
    <title>Authorize Klui Anything</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 70% 10%,#12395a 0,transparent 38%),linear-gradient(145deg,#050a12,#0a1727 58%,#07111f); color: #f7fbff; font-family: Inter,"Segoe UI",system-ui,sans-serif; }
      main { width: min(520px,100%); padding: clamp(26px,5vw,38px); border: 1px solid #bdefff25; border-radius: 22px; background: linear-gradient(155deg,#ffffff12,#ffffff07); box-shadow: inset 0 1px #ffffff18,0 30px 80px #0007; backdrop-filter: blur(16px); }
      header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
      header img { width: 54px; height: 54px; border-radius: 15px; box-shadow: 0 10px 28px #0007; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -.025em; }
      p { color: #aebfd2; line-height: 1.6; }
      header p { margin: 5px 0 0; font-size: 14px; }
      .privacy { display: flex; align-items: flex-start; gap: 11px; margin: 22px 0; padding: 15px; border: 1px solid #ffffff12; border-radius: 12px; background: #02070d66; color: #bfcede; font-size: 14px; line-height: 1.5; }
      .privacy input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: #7ee9ff; }
      .actions { display: flex; gap: 10px; }
      button { min-height: 44px; padding: 0 18px; border: 1px solid #ffffff24; border-radius: 10px; background: #ffffff0a; color: #e8f3ff; font: inherit; font-weight: 700; cursor: pointer; }
      button.primary { flex: 1; border-color: #8cecff; background: #8cecff; color: #07111f; }
      button:hover:not(:disabled) { transform: translateY(-1px); }
      button:focus-visible,input:focus-visible { outline: 3px solid #8cecff66; outline-offset: 3px; }
      button:disabled { opacity: .45; cursor: default; transform: none; }
      #status { min-height: 22px; margin-bottom: 0; color: #8fa5bc; font-size: 13px; }
      #signIn { margin-top: 18px; padding-top: 2px; }
      #googleButton { min-height: 42px; }
      [hidden] { display: none !important; }
      @media (max-width: 520px) { body { padding: 14px; } main { border-radius: 18px; } .actions { flex-direction: column-reverse; } button.primary { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <header><img src="/icons/icon-192.png" alt=""><div><h1>Open Klui Anything?</h1><p id="account">Authorize the desktop app with your Klui account.</p></div></header>
      <section id="approval" hidden>
        <p>Klui Anything will use your active plan and shared weekly allowance. The Windows beta runs Pi and inline workflows locally; computer control is not included yet.</p>
        <label class="privacy"><input id="privacy" type="checkbox"><span>I understand Klui Anything may send screen context and voice audio to Klui and its AI providers to process my requests.</span></label>
        <div class="actions"><button id="deny" type="button">Cancel</button><button id="approve" class="primary" type="button" disabled>Authorize desktop</button></div>
      </section>
      <section id="signIn" hidden><p>Sign in to klui.tech to continue.</p><div id="googleButton"></div></section>
      <p id="status" role="status">Loading authorization…</p>
    </main>
    <script type="module" src="/oauth/consent/consent.js"></script>
  </body>
</html>
