<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Authorize Klui Anything</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f6f7fa; color: #171717; font-family: Inter, system-ui, sans-serif; }
      main { width: min(500px, 100%); padding: 32px; border: 1px solid #dedfe4; border-radius: 16px; background: white; box-shadow: 0 18px 60px rgba(0,0,0,.08); }
      header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
      header img { width: 52px; height: 52px; border-radius: 13px; }
      h1 { margin: 0; font-size: 24px; } p { color: #555; line-height: 1.55; }
      .privacy { display: flex; align-items: flex-start; gap: 10px; margin: 22px 0; padding: 14px; border-radius: 10px; background: #f3f4f7; font-size: 14px; line-height: 1.45; }
      .privacy input { margin-top: 3px; }
      .actions { display: flex; gap: 10px; }
      button { min-height: 42px; padding: 0 18px; border: 1px solid #d4d5da; border-radius: 9px; background: white; font: inherit; font-weight: 650; cursor: pointer; }
      button.primary { flex: 1; border-color: #111; background: #111; color: white; }
      button:disabled { opacity: .5; cursor: default; }
      #status { min-height: 22px; color: #666; font-size: 13px; }
      #signIn { margin-top: 18px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header><img src="/icons/icon-192.png" alt=""><div><h1>Open Klui Anything?</h1><p id="account">Authorize the desktop app with your Klui account.</p></div></header>
      <section id="approval" hidden>
        <p>Klui Anything will use your active plan and shared weekly allowance. The Windows beta runs Pi and inline workflows locally; computer control is not included yet.</p>
        <label class="privacy"><input id="privacy" type="checkbox"><span>I understand Klui Anything may send screen context and voice audio to Klui and its AI providers to process my requests.</span></label>
        <div class="actions"><button id="deny" type="button">Cancel</button><button id="approve" class="primary" type="button" disabled>Authorize desktop</button></div>
      </section>
      <section id="signIn" hidden><p>Sign in to klui.tech to continue.</p><div id="googleButton"></div></section>
      <p id="status" role="status">Loading authorization…</p>
    </main>
    <script type="module" src="/oauth/consent/consent.js"></script>
  </body>
</html>
