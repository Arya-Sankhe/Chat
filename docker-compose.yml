services:
  klui-chat:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ${WINDOWS_DOWNLOADS_DIR:-./public/downloads/windows}:/app/public/downloads/windows:ro
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8082}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-klui-local-onlyoffice-change-me}
      WEBSEARCH_PRIMARY_PROVIDER: ${WEBSEARCH_PRIMARY_PROVIDER:-tinyfish}
      JINA_READER_BASE_URL: http://jina-reader:8081
      # Speech: Pocket TTS first, Kokoro when both workers are busy. Empty = Kokoro only.
      POCKET_TTS_URLS: ${POCKET_TTS_URLS-http://pocket-tts-1:8000,http://pocket-tts-2:8000}
      RESEARCH_QUEUE: ${RESEARCH_QUEUE:-local}
      TRANSCRIBE_QUEUE: ${TRANSCRIBE_QUEUE:-local}
      DOCUMENT_QUEUE: ${DOCUMENT_QUEUE:-local}
    restart: unless-stopped

  # Self-hosted Jina Reader for read_url. Private-only: no published ports;
  # klui-chat falls back to hosted r.jina.ai when this service fails.
  jina-reader:
    image: ghcr.io/jina-ai/reader:oss
    cap_add:
      - SYS_ADMIN
    # Docker's default AppArmor profile now blocks Chrome's sandbox on the VPS (Debian 13).
    security_opt:
      - apparmor=unconfined
    expose:
      - "8081"
    environment:
      NODE_ENV: production
      # Reader enables DNS/private-IP rejection for production GCP-shaped deployments.
      GCLOUD_PROJECT: klui-self-hosted
    mem_limit: 2g
    cpus: "1.0"
    restart: unless-stopped

  # Self-hosted Pocket TTS (Kyutai, int8, CPU) for voice mode and tutor calls. A model runs one
  # generation at a time, so there are two workers, each with 2 threads; klui-chat queues between
  # them and falls back to Kokoro when both are taken. Private-only: no published ports.
  pocket-tts-1: &pocket-tts
    build:
      context: ./ops/pocket-tts
    init: true
    expose:
      - "8000"
    environment:
      TTS_THREADS: "2"
    volumes:
      - pocket-tts-cache:/root/.cache
    cpus: "2.0"
    mem_limit: 1536m
    memswap_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  pocket-tts-2: *pocket-tts

  onlyoffice:
    image: onlyoffice/documentserver:9.3.1
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"
    environment:
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-klui-local-onlyoffice-change-me}
      JWT_ENABLED: "true"
      # R2/S3 signed URLs break if DS attaches Authorization: Bearer on download.
      JWT_HEADER: AuthorizationJwt
    restart: unless-stopped

  document-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DOCUMENT_QUEUE: ${DOCUMENT_QUEUE:-local}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-2}
      DOCUMENT_WORKER_MAX_IDLE_SECONDS: ${DOCUMENT_WORKER_MAX_IDLE_SECONDS:-10}
    mem_limit: ${DOCUMENT_WORKER_MEMORY_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Speech-to-text for Dojo audio sources (Parakeet TDT 0.6B v2 int8 via sherpa-onnx).
  # Isolated on purpose: one job at a time, 4 threads, low CPU priority, and a hard 3 GB
  # memory cap with no swap, so it can only ever take itself down, never the site.
  transcriber:
    build:
      context: .
      dockerfile: transcriber/Dockerfile
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      TRANSCRIBE_THREADS: ${TRANSCRIBE_THREADS:-4}
      # Must match klui-chat's; only jobs from this queue are claimed.
      TRANSCRIBE_QUEUE: ${TRANSCRIBE_QUEUE:-local}
      TRANSCRIBE_MAX_SECONDS: ${STUDY_AUDIO_MAX_SECONDS:-14400}
      # Soft ceiling for the per-job child; the service stops it cleanly before the hard cap.
      TRANSCRIBE_CHILD_MAX_RSS_MB: ${TRANSCRIBE_CHILD_MAX_RSS_MB:-2600}
    cpus: "4.0"
    cpu_shares: 256
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 256
    stop_grace_period: 30s
    volumes:
      - transcriber-work:/work
    healthcheck:
      test: ["CMD", "python", "-m", "transcriber.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  research-worker:
    build: .
    command: ["node", "server/research/worker.js"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      WEBSEARCH_PRIMARY_PROVIDER: ${WEBSEARCH_PRIMARY_PROVIDER:-tinyfish}
      JINA_READER_BASE_URL: http://jina-reader:8081
      RESEARCH_WORKER_CONCURRENCY: ${RESEARCH_WORKER_CONCURRENCY:-3}
      RESEARCH_WORKER_POLL_MS: ${RESEARCH_WORKER_POLL_MS:-5000}
      RESEARCH_WORKER_MAX_POLL_MS: ${RESEARCH_WORKER_MAX_POLL_MS:-10000}
      RESEARCH_QUEUE: ${RESEARCH_QUEUE:-local}
    mem_limit: 512m
    cpus: "0.75"
    healthcheck:
      disable: true
    restart: unless-stopped

  storage-cleanup:
    build: .
    command: ["node", "scripts/cleanup-orphan-storage.mjs"]
    env_file:
      - path: .env
        required: false
    profiles: ["maintenance"]
    restart: "no"

volumes:
  transcriber-work:
  pocket-tts-cache:
