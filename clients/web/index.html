<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
    <title>Klui AI</title>
    <script>
      // Styles meant only for the packaged app (not the mobile website) key off this class.
      if (window.__kluiNative) document.documentElement.classList.add("native-app");
      // Start the app's two boot requests with the page rather than after its scripts load.
      // api.js takes each response once; the packaged app ignores them and asks its API origin.
      if (/^https?:$/.test(location.protocol) && !window.__kluiNative) {
        window.__kluiBoot = {
          config: fetch("/api/config", { cache: "no-store" }).catch(function () { return null; }),
          plans: fetch("/api/plans").catch(function () { return null; })
        };
      }
    </script>
    <meta name="description" content="Klui is the AI built for students. Chat, research, and write in one place — notes, files, citations, essays, and slides.">
    <link rel="canonical" href="https://klui.ai/">

    <meta property="og:title" content="Klui AI">

    <meta property="og:url" content="https://klui.ai/">

    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260825-icon">

        "@context": "https://schema.org",

          {
            "@type": "Organization",
            "name": "Klui",
            "alternateName": "Klui AI",

          },
          {

    <script defer src="/vendor/dompurify/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.3/lib/marked.umd.js" integrity="sha384-coEhNYf+uY/IAdm3afqLaaHhP4vzpDHARAMbRvTGjDwDSCD7DnG5dAKe4sDoUupt" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/vendor/slot-text/style.css">
  </head>
  <body>
    <script>
      if (window.__kluiNative || window.matchMedia("(max-width: 860px)").matches) {
        document.body.classList.add("capacitor-native", "mobile-ui");
        try {
          const appearance = JSON.parse(localStorage.getItem("klui.chat.controls.v1") || "{}").appearance || "system";
          document.body.dataset.mode = appearance === "dark" || (appearance === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        } catch {}
        const kluiLaunchMascot = '<svg viewBox="1 3.5 14 8.5" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="#8fd3fb"><path d="M3 3.5h10v6H3zM1 5.5h2v2H1zM13 5.5h2v2h-2zM5 9.5h1V12H5zM10 9.5h1V12h-1z"/></g><path fill="#16202e" d="M5 5h1v1.5H5zM10 5h1v1.5h-1z"/></svg>';
        const launch = document.createElement("div");
        launch.id = "mobileLaunchScreen";
        launch.setAttribute("aria-label", "Klui is loading");
        launch.innerHTML = kluiLaunchMascot + '<span>Klui</span>';
        document.body.append(launch);
        setTimeout(() => { if (!launch.classList.contains("waiting")) launch.remove(); }, 500);
        window.__kluiLaunchMascot = kluiLaunchMascot;
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
